[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Blockscout verification (no API key needed)
[etherscan]
robinhood = { key = "none", url = "https://robinhoodchain.blockscout.com/api/", chain = 4663 }
robinhood_testnet = { key = "none", url = "https://explorer.testnet.chain.robinhood.com/api/", chain = 46630 }
